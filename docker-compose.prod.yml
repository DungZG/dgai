# dgai — production stack for the rented server.
#
# The image is built by GitHub Actions and published to GHCR, so the server only
# pulls it. This keeps the server free of Go/Bun and makes deploys repeatable.
#
#   cp .env.dgai.example .env.dgai && edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.dgai pull
#   docker compose -f docker-compose.prod.yml --env-file .env.dgai up -d
#
# Pulling a newer build:
#   docker compose -f docker-compose.prod.yml --env-file .env.dgai pull dgai
#   docker compose -f docker-compose.prod.yml --env-file .env.dgai up -d dgai
#
# HTTPS: Caddy obtains a Let's Encrypt certificate for DGAI_SITE_ADDRESS as long
# as DNS points at this server and ports 80/443 are open.

services:
  dgai:
    image: ghcr.io/${DGAI_IMAGE_REPO:?set DGAI_IMAGE_REPO e.g. dungzg/dgai}:${DGAI_IMAGE_TAG:-latest}
    container_name: dgai
    restart: always
    command: --log-dir /app/logs
    volumes:
      - dgai_data:/data
      - dgai_logs:/app/logs
    environment:
      - SQL_DSN=postgresql://dgai:${DGAI_DB_PASSWORD:?set DGAI_DB_PASSWORD}@postgres:5432/dgai
      - REDIS_CONN_STRING=redis://:${DGAI_REDIS_PASSWORD:?set DGAI_REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${DGAI_SESSION_SECRET:?set DGAI_SESSION_SECRET}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=${DGAI_PUBLIC_URL:?set DGAI_PUBLIC_URL}
      - TRUSTED_PROXIES=172.16.0.0/12
      - TZ=Asia/Ho_Chi_Minh
      - BATCH_UPDATE_ENABLED=true
      - ERROR_LOG_ENABLED=true
      - STREAMING_TIMEOUT=300
      - NODE_NAME=dgai-node-1
      # The dashboard refreshes its session on every page load, so the shared
      # critical bucket must cover normal browsing, not just login attempts.
      - CRITICAL_RATE_LIMIT=120
      - CRITICAL_RATE_LIMIT_DURATION=60
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dgai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Token Optimizer: an optional upstream that New API reaches as a channel.
  # It is internal-only (no published port); a channel points at
  # http://optimizer:8080/u/<upstream> and New API keeps auth, quota and logs.
  # Start it only when optimizer.json exists on the server.
  optimizer:
    image: ghcr.io/${DGAI_IMAGE_REPO:?set DGAI_IMAGE_REPO e.g. dungzg/dgai}:${DGAI_IMAGE_TAG:-latest}
    container_name: dgai-optimizer
    restart: always
    entrypoint: ["/optimizer"]
    command: ["-config", "/etc/optimizer/config.json"]
    volumes:
      - ./optimizer.json:/etc/optimizer/config.json:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - dgai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - optimizer

  redis:
    image: redis:7-alpine
    container_name: dgai-redis
    restart: always
    command: ["redis-server", "--requirepass", "${DGAI_REDIS_PASSWORD:?set DGAI_REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - dgai_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - dgai-network

  postgres:
    image: postgres:15-alpine
    container_name: dgai-postgres
    restart: always
    environment:
      POSTGRES_USER: dgai
      POSTGRES_PASSWORD: ${DGAI_DB_PASSWORD:?set DGAI_DB_PASSWORD}
      POSTGRES_DB: dgai
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - dgai_pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - dgai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgai -d dgai"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: dgai-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DGAI_SITE_ADDRESS=${DGAI_SITE_ADDRESS:?set DGAI_SITE_ADDRESS}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - dgai_caddy_data:/data
      - dgai_caddy_config:/config
    depends_on:
      dgai:
        condition: service_started
    networks:
      - dgai-network

volumes:
  dgai_data:
  dgai_logs:
  dgai_pg_data:
  dgai_redis_data:
  dgai_caddy_data:
  dgai_caddy_config:

networks:
  dgai-network:
    driver: bridge
